<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b5d">
    <title>Offline Workspace - ENT System</title>
    <link rel="icon" href="../image/ent-logo.webp">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../style/offlineWorkspace.css">
</head>
<body class="ent-offline-workspace">
    <main class="offline-workspace" aria-labelledby="workspaceTitle">
        <a class="offline-logout" href="../pages/login.html" id="offlineLogout">Log out</a>
        <h1 id="workspaceTitle">Where do you want to work?</h1>
        <section class="offline-connection" aria-live="polite" aria-atomic="true">
            <span class="offline-connection-indicator" aria-hidden="true"></span>
            <div>
                <strong id="offlineConnectionTitle">Offline workspace is ready</strong>
                <p id="offlineConnectionMessage">Your reports remain available without signal. Work saved offline stays on this device until you reconnect and sign in online.</p>
            </div>
        </section>
        <nav class="offline-workspace-actions" aria-label="Report modules">
            <button type="button" data-page="nasalEndoscopy.html">
                <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M17.8 4c-4.7 0-8 3.3-8 8.1 0 2.3.8 4.3 2.1 6.2l-2.2 8.4c-.5 1.9.9 3.3 2.7 2.5l4.1-1.9 4.1 1.9c1.8.8 3.2-.6 2.7-2.5l-2.2-8.4c1.4-1.9 2.1-3.9 2.1-6.2C25.2 7.3 22.3 4 17.8 4Zm0 3.2c2.8 0 4.2 2 4.2 4.9 0 1.8-.7 3.5-2 5.3l-.6.8 1.8 6.8-2.7-1.2-2.7 1.2 1.8-6.8-.6-.8c-1.3-1.8-2-3.5-2-5.3 0-2.9 1.1-4.9 2.8-4.9Z" fill="currentColor"/><circle cx="17.8" cy="12" r="1.6" fill="currentColor"/></svg>
                <span>Nasal Endoscopy</span>
            </button>
            <button type="button" data-page="laryngealEndoscopy.html">
                <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 4.5c-3.6 0-6.2 2.8-6.2 6.4 0 2.1.8 4.1 2.2 5.8l-2.5 4.2c-.8 1.4-.7 3.2.3 4.5l3.3 4.2c1.4 1.8 4.2 1.8 5.6 0l3.3-4.2c1-1.3 1.1-3.1.3-4.5l-2.5-4.2c1.4-1.7 2.2-3.7 2.2-5.8 0-3.6-2.6-6.4-6-6.4Zm0 3.2c1.7 0 2.8 1.3 2.8 3.2 0 1.6-.7 3.2-2 4.7l-.9 1.1 3.3 5.5c.2.4.2.9-.1 1.3l-3.1 4-3.1-4c-.3-.4-.3-.9-.1-1.3l3.3-5.5-.9-1.1c-1.3-1.5-2-3.1-2-4.7 0-1.9 1.1-3.2 2.8-3.2Z" fill="currentColor"/><path d="M14 19h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>Laryngeal Endoscopy</span>
            </button>
            <button type="button" data-page="cf4Form.html">
                <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M10 4.5h11l7 7v19H10a2 2 0 0 1-2-2v-22a2 2 0 0 1 2-2Zm10 3.2v5h5l-5-5ZM12 17h12v2.5H12V17Zm0 5h12v2.5H12V22Zm0 5h8v2.5h-8V27Z" fill="currentColor"/><path d="M15 13.5h2.5v-2.5H20v2.5h2.5V16H20v2.5h-2.5V16H15v-2.5Z" fill="#fff"/></svg>
                <span>CF4 Form</span>
            </button>
        </nav>
    </main>
    <script src="../function/paths.js"></script>
    <script src="../js/lib/supabase.min.js" defer></script>
    <script src="../function/supabaseClient.js" defer></script>
    <script src="../function/auth.js" defer></script>
    <script src="../function/photoStore.js" defer></script>
    <script src="../function/offlineStore.js" defer></script>
    <script src="../function/syncEngine.js" defer></script>
    <script src="../function/offlineWorkspace.js" defer></script>
</body>
</html>
